[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-research-platform"
version = "0.1.0"
description = "Reusable point-in-time factor research and backtesting platform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.scripts]
factor-research = "research_platform.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["research_platform*"]

[tool.pytest.ini_options]
testpaths = ["tester"]
markers = [
  "real_data: tests that require the complete local market dataset",
]
